function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||L).appendChild(e);return e}
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function dist(f,p){if(f.pts.length==1)return Math.hypot(p[0]-f.pts[0][0],p[1]-f.pts[0][1]);let m=1e9;for(let i=0;i<f.pts.length-1;i++)m=Math.min(m,dseg(p,f.pts[i],f.pts[i+1]));return m}
function show(f,col,label){const w=f.c=='r';
 if(w)el('polyline',{points:f.pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:col,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'});
 else el('circle',{cx:f.pts[0][0],cy:f.pts[0][1],r:Math.min(TOL[f.c],26),fill:col,'fill-opacity':.3,stroke:col,'stroke-width':2.5});
 if(label){const p=f.pts[Math.floor(f.pts.length/2)];const t=el('text',{x:Math.min(Math.max(p[0],60),610),y:p[1]-(w?10:Math.min(TOL[f.c],26)+5),'text-anchor':'middle',class:'t'});t.textContent=f.n}}

function pt(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(svg.getScreenCTM().inverse());return[r.x,r.y]}
function setCats(){const d=$('cats');d.innerHTML='';const all={...CATS,a:'Wszystko'};for(const k in all){const b=document.createElement('button');b.textContent=all[k];if(k==cat)b.className='on';b.onclick=()=>{cat=k;setCats();start()};d.appendChild(b)}}
const BS={rw:'W',ro:'O',rb:'B'};
function pool(){return F.filter(f=>cat=='a'||(BS[cat]?f.b==BS[cat]:f.c==cat))}
function start(list){clr();$('rt').style.display='none';$('nx').style.display='none';$('msg').textContent='';ok=0;tot=0;wrong=[];
 if(mode=='n'){$('ql').textContent='Tryb nauki';$('qn').textContent='Dotknij mapę';$('sc').textContent='';pool().forEach(f=>show(f,'#2a6fdb'));return}
 queue=(list||pool()).slice().sort(()=>Math.random()-.5);next()}
function next(){clr();lock=false;$('nx').style.display='none';$('msg').textContent='';
 if(!queue.length){cur=null;$('ql').textContent='Koniec rundy';$('qn').textContent=ok+' / '+tot+' poprawnie';if(wrong.length)$('rt').style.display='';return}
 cur=queue.shift();$('ql').textContent=LBL[cur.c]+' – kliknij na mapie:';$('qn').textContent=cur.n;$('sc').textContent='✔ '+ok+'  ✖ '+(tot-ok)+'  ·  zostało '+queue.length}
svg.addEventListener('click',e=>{const p=pt(e);
 if(mode=='n'){clr();pool().forEach(f=>show(f,'#2a6fdb'));let b=null,m=1e9;pool().forEach(f=>{const d=dist(f,p)-TOL[f.c]*.0;if(d<m){m=d;b=f}});if(b&&m<TOL[b.c]+10){clr();show(b,'#d98b00',true);$('qn').textContent=b.n;$('ql').textContent=LBL[b.c]+(b.d?' – '+b.d:'')}return}
 if(!cur||lock)return;lock=true;tot++;const hit=dist(cur,p)<=TOL[cur.c]*M;
 if(hit){ok++;show(cur,'#1f9d55',true);$('msg').textContent='✅ Dobrze! '+(cur.d?cur.n+' – '+cur.d:'');setTimeout(next,900)}
 else{wrong.push(cur);el('circle',{cx:p[0],cy:p[1],r:5,fill:'#d93b3b'});show(cur,'#d93b3b',true);$('msg').textContent='❌ Tu jest '+cur.n+(cur.d?' ('+cur.d+')':'')+' – zaznaczone na czerwono';$('nx').style.display=''}
